packages:
  - 'chrome-extension'
  - 'pages/*'
  - 'packages/*'

allowBuilds:
  '@swc/core': true
  esbuild: true
  unrs-resolver: true

overrides:
  base-x@4: 4.0.1
  sha.js: ^2.4.12
  jiti: ^2.4.2
  typescript: 5.7.3
  ws@>=8.0.0 <8.21.0: '>=8.21.0'

minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Backports published after a newer line had provenance, which pnpm counts as a trust downgrade.
trustPolicyExclude:
  - 'eslint-import-resolver-typescript@3.10.1'
  - 'semver@6.3.1'
  - 'tailwind-merge@2.6.1'
  - 'undici-types@6.19.8 || 6.21.0'
blockExoticSubdeps: true
